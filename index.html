<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="A mobile-first denomination calculator for Indian notes and coins.">
  <title>Denocal - Denomination Calculator</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <div class="wrap">

    <header class="head">
      <h1>Denomination Calculator</h1>
      <p>Enter how many notes and coins you have — get the total.</p>
    </header>

    <!-- Denomination rows are injected here by script.js -->
    <section class="grid" id="grid" aria-label="Denominations"></section>

    <section class="summary" aria-label="Summary">

      <div class="total">
        <span class="label">Total</span>
        <span class="amount" id="total">₹0</span>
      </div>

      <div class="meta">
        <strong id="pieces">0</strong> notes &amp; coins in total
      </div>

      <div class="breakdown" id="breakdown"></div>

      <div class="actions">
        <button class="btn" id="clear" type="button">Clear all</button>
        <button class="btn primary" id="copy" type="button">Copy summary</button>
      </div>

    </section>

  </div>

</body>
</html>
