<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f766e">
<title>Denocal-Denomination Calculator</title>
<style>
  /* ---------- Theme tokens ---------- */
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --accent: #0f766e;
    --accent-soft: #d5f2ee;
    --on-accent: #ffffff;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 10px 24px -14px rgba(15, 23, 42, .25);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1120;
      --card: #131c31;
      --text: #e8eefc;
      --muted: #93a3b8;
      --border: #223049;
      --accent: #2dd4bf;
      --accent-soft: #103733;
      --on-accent: #04211f;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5);
    }
  }

  /* ---------- Reset / base ---------- */
  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 16px 56px;
  }

  /* ---------- Header ---------- */
  .head { margin-bottom: 18px; }

  .head h1 {
    margin: 0 0 4px;
    font-size: 1.45rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .head p {
    margin: 0;
    color: var(--muted);
    font-size: 0.9rem;
  }

  /* ---------- Denomination grid (mobile first) ---------- */
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }

  @media (min-width: 560px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (min-width: 860px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
    .wrap { padding-top: 36px; }
    .head h1 { font-size: 1.75rem; }
  }

  .denom {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 9px 9px 11px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    -webkit-tap-highlight-color: transparent;
    transition: border-color .16s ease;
  }

  .denom.active {
    border-color: var(--accent);
  }

  /* ---------- Specimen thumbnail ---------- */
  .thumb {
    flex: 0 0 44px;
    height: 30px;
    display: grid;
    place-items: center;
  }

  .thumb svg {
    display: block;
    width: 44px;
    height: auto;
  }

  .thumb.coin svg { width: 30px; }

  /* ---------- Amount label ---------- */
  .value {
    flex: 1 1 auto;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }

  /* ---------- Stepper ---------- */
  .stepper {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 2px;
    background: var(--bg);
    border-radius: 10px;
    padding: 2px;
    transition: box-shadow .15s ease;
  }

  .stepper:focus-within {
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .stepper button {
    width: 32px;
    height: 32px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--accent);
    font-size: 1.2rem;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background .15s ease, transform .1s ease;
  }

  .stepper button:hover { background: var(--accent-soft); }
  .stepper button:active { transform: scale(.9); }

  .stepper input {
    width: 42px;
    height: 32px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    text-align: center;
    border-radius: 8px;
    -moz-appearance: textfield;
  }

  .stepper input:focus { outline: none; }

  .stepper input::placeholder {
    color: var(--muted);
    font-weight: 500;
    opacity: .7;
  }

  /* ---------- Summary card ---------- */
  .summary {
    margin-top: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .total {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px;
    background: var(--accent);
    color: var(--on-accent);
  }

  .total .label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    opacity: .85;
  }

  .total .amount {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  @media (min-width: 560px) {
    .total { padding: 20px 22px; }
    .total .amount { font-size: 2rem; }
  }

  .meta {
    padding: 10px 16px 0;
    font-size: 0.8rem;
    color: var(--muted);
  }

  .meta strong {
    color: var(--text);
    font-weight: 700;
  }

  /* ---------- Breakdown ---------- */
  .breakdown {
    padding: 6px 16px 2px;
  }

  .breakdown .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px dashed var(--border);
    font-size: 0.9rem;
    font-variant-numeric: tabular-nums;
  }

  .breakdown .row:last-child { border-bottom: 0; }

  .row-left {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
  }

  .mini {
    flex: 0 0 30px;
    height: 20px;
    display: grid;
    place-items: center;
  }

  .mini svg { display: block; width: 30px; height: auto; }
  .mini.coin svg { width: 20px; }

  .breakdown .sub {
    font-weight: 700;
    white-space: nowrap;
  }

  .breakdown .empty {
    margin: 12px 0 14px;
    color: var(--muted);
    font-size: 0.87rem;
  }

  /* ---------- Actions ---------- */
  .actions {
    display: flex;
    gap: 10px;
    padding: 14px 16px 16px;
  }

  .btn {
    flex: 1 1 0;
    min-height: 46px;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background .15s ease, transform .1s ease, opacity .15s ease;
  }

  .btn:hover { background: var(--bg); }
  .btn:active { transform: scale(.985); }

  .btn.primary {
    background: var(--accent);
    border-color: transparent;
    color: var(--on-accent);
  }

  .btn.primary:hover { opacity: .9; background: var(--accent); }

  .btn:disabled {
    cursor: default;
    opacity: .8;
  }

  .btn:focus-visible,
  .stepper button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="head">
    <h1>Denomination Calculator</h1>
    <p>Enter how many notes and coins you have — get the total.</p>
  </header>

  <section class="grid" id="grid" aria-label="Denominations"></section>

  <section class="summary" aria-label="Summary">
    <div class="total">
      <span class="label">Total</span>
      <span class="amount" id="total">₹0</span>
    </div>
    <div class="meta"><strong id="pieces">0</strong> notes &amp; coins in total</div>
    <div class="breakdown" id="breakdown"></div>
    <div class="actions">
      <button class="btn" id="clear" type="button">Clear all</button>
      <button class="btn primary" id="copy" type="button">Copy summary</button>
    </div>
  </section>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     1. CONFIG
     ========================================================= */

  // Order matters — highest to lowest.
  const DENOMINATIONS = [500, 200, 100, 50, 20, 10, 5, 2, 1];

  // Specimen colours for each denomination (approximate real-world hues).
  const SPECIMENS = {
    500:  { type: 'note', fill: '#8f918c', stroke: '#5b5d58', ink: '#ffffff' },
    200:  { type: 'note', fill: '#f0bd45', stroke: '#a97c12', ink: '#4a3208' },
    100:  { type: 'note', fill: '#b6a3d8', stroke: '#7259a3', ink: '#ffffff' },
    50:   { type: 'note', fill: '#8fb4dd', stroke: '#3f6ea3', ink: '#0f2f55' },
    20:   { type: 'note', fill: '#e0805f', stroke: '#a94727', ink: '#ffffff' },
    10:   { type: 'note', fill: '#a8703f', stroke: '#77492a', ink: '#ffffff' },
    5:    { type: 'coin', fill: '#8fb894', stroke: '#4d7a53', ink: '#ffffff' },
    2:    { type: 'coin', fill: '#a98cc4', stroke: '#6f5292', ink: '#ffffff' },
    1:    { type: 'coin', fill: '#cf93ab', stroke: '#96607a', ink: '#ffffff' }
  };

  const money = new Intl.NumberFormat('en-IN', {
    style: 'currency',
    currency: 'INR',
    maximumFractionDigits: 0
  });

  /* =========================================================
     2. SPECIMEN IMAGE BUILDER (inline SVG — no network needed)
     ========================================================= */

  function specimenSVG(denom) {
    const s = SPECIMENS[denom];
    const font = 'system-ui,-apple-system,Segoe UI,Roboto,sans-serif';

    if (s.type === 'note') {
      // A stylised banknote: coloured body, inner border, portrait oval, numeral.
      const size = denom >= 1000 ? 11 : 13;

      return '<svg viewBox="0 0 64 40" role="img" aria-label="' + denom + ' rupee note specimen">' +
        '<rect x="1" y="1" width="62" height="38" rx="4.5" fill="' + s.fill + '" stroke="' + s.stroke + '" stroke-width="2"/>' +
        '<rect x="4.5" y="4.5" width="55" height="31" rx="3" fill="none" stroke="' + s.ink + '" stroke-opacity=".38" stroke-width="1"/>' +
        '<circle cx="17" cy="20" r="8.5" fill="' + s.ink + '" fill-opacity=".22" stroke="' + s.ink + '" stroke-opacity=".5" stroke-width="1"/>' +
        '<path d="M13.5 23.5a4 4 0 0 1 7 0" fill="' + s.ink + '" fill-opacity=".3"/>' +
        '<circle cx="17" cy="17.5" r="2.6" fill="' + s.ink + '" fill-opacity=".3"/>' +
        '<text x="43" y="24.5" font-size="' + size + '" font-weight="700" fill="' + s.ink + '" ' +
          'text-anchor="middle" font-family="' + font + '">' + denom + '</text>' +
      '</svg>';
    }

    // A stylised coin: two concentric circles with the numeral in the middle.
    return '<svg viewBox="0 0 40 40" role="img" aria-label="' + denom + ' rupee coin specimen">' +
      '<circle cx="20" cy="20" r="18" fill="' + s.fill + '" stroke="' + s.stroke + '" stroke-width="2"/>' +
      '<circle cx="20" cy="20" r="14" fill="none" stroke="' + s.ink + '" stroke-opacity=".42" stroke-width="1"/>' +
      '<text x="20" y="25.5" font-size="15" font-weight="700" fill="' + s.ink + '" ' +
        'text-anchor="middle" font-family="' + font + '">' + denom + '</text>' +
    '</svg>';
  }

  /* =========================================================
     3. DOM REFERENCES
     ========================================================= */

  const grid        = document.getElementById('grid');
  const totalEl     = document.getElementById('total');
  const piecesEl    = document.getElementById('pieces');
  const breakdownEl = document.getElementById('breakdown');
  const clearBtn    = document.getElementById('clear');
  const copyBtn     = document.getElementById('copy');

  // Snapshot of the last calculation (used by the copy button).
  let lastRows   = [];
  let lastTotal  = 0;
  let lastPieces = 0;

  /* =========================================================
     4. BUILD THE GRID
     ========================================================= */

  grid.innerHTML = DENOMINATIONS.map(function (denom) {
    const spec = SPECIMENS[denom];
    const label = money.format(denom);

    return '<div class="denom" data-value="' + denom + '">' +
      '<span class="thumb ' + spec.type + '">' + specimenSVG(denom) + '</span>' +
      '<span class="value">' + label + '</span>' +
      '<div class="stepper">' +
        '<button type="button" data-action="dec" aria-label="Decrease ' + label + '">\u2212</button>' +
        '<input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" ' +
               'placeholder="0" aria-label="Quantity of ' + label + '">' +
        '<button type="button" data-action="inc" aria-label="Increase ' + label + '">+</button>' +
      '</div>' +
    '</div>';
  }).join('');

  /* =========================================================
     5. CALCULATE + RENDER
     ========================================================= */

  function update() {
    let total = 0;
    let pieces = 0;
    const rows = [];

    grid.querySelectorAll('.denom').forEach(function (row) {
      const value = Number(row.dataset.value);
      const input = row.querySelector('input');
      const qty = parseInt(input.value, 10) || 0;

      row.classList.toggle('active', qty > 0);

      if (qty > 0) {
        const subtotal = value * qty;
        total += subtotal;
        pieces += qty;
        rows.push({ value: value, qty: qty, subtotal: subtotal });
      }
    });

    lastRows   = rows;
    lastTotal  = total;
    lastPieces = pieces;

    totalEl.textContent  = money.format(total);
    piecesEl.textContent = pieces;

    renderBreakdown(rows);
  }

  function renderBreakdown(rows) {
    if (rows.length === 0) {
      breakdownEl.innerHTML = '<p class="empty">Enter quantities above to see the breakdown.</p>';
      return;
    }

    breakdownEl.innerHTML = rows.map(function (r) {
      const type = SPECIMENS[r.value].type;
      return '<div class="row">' +
        '<span class="row-left">' +
          '<span class="mini ' + type + '">' + specimenSVG(r.value) + '</span>' +
          '<span>' + money.format(r.value) + ' &times; ' + r.qty + '</span>' +
        '</span>' +
        '<span class="sub">' + money.format(r.subtotal) + '</span>' +
      '</div>';
    }).join('');
  }

  /* =========================================================
     6. EVENTS
     ========================================================= */

  // Stepper buttons (event delegation).
  grid.addEventListener('click', function (event) {
    const button = event.target.closest('button[data-action]');
    if (!button) return;

    const row = button.closest('.denom');
    const input = row.querySelector('input');
    const step = button.dataset.action === 'inc' ? 1 : -1;
    const current = parseInt(input.value, 10) || 0;
    const next = Math.max(0, current + step);

    input.value = next === 0 ? '' : String(next);
    update();
  });

  // Typing in an input.
  grid.addEventListener('input', function (event) {
    const input = event.target;
    if (input.tagName !== 'INPUT') return;

    const cleaned = input.value.replace(/\D/g, '');
    if (cleaned !== input.value) input.value = cleaned;

    update();
  });

  // Clear all.
  clearBtn.addEventListener('click', function () {
    grid.querySelectorAll('input').forEach(function (input) { input.value = ''; });
    update();

    const first = grid.querySelector('input');
    if (first) first.focus();
  });

  // Copy summary.
  copyBtn.addEventListener('click', function () {
    if (lastRows.length === 0) {
      flashButton(copyBtn, 'Nothing to copy');
      return;
    }

    const lines = lastRows.map(function (r) {
      return money.format(r.value) + ' x ' + r.qty + ' = ' + money.format(r.subtotal);
    });

    lines.push('');
    lines.push('Total: ' + money.format(lastTotal) + ' (' + lastPieces + ' notes & coins)');

    const text = lines.join('\n');

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { flashButton(copyBtn, 'Copied!'); },
        function () { flashButton(copyBtn, 'Copy failed'); }
      );
    } else {
      flashButton(copyBtn, 'Not supported');
    }
  });

  function flashButton(button, message) {
    if (button.dataset.busy === '1') return;
    button.dataset.busy = '1';

    const original = button.textContent;
    button.textContent = message;
    button.disabled = true;

    setTimeout(function () {
      button.textContent = original;
      button.disabled = false;
      button.dataset.busy = '0';
    }, 1400);
  }

  /* =========================================================
     7. INIT
     ========================================================= */

  update();
})();
</script>
</body>
</html>
